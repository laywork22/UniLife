name: uni_life
description: "UniLife — gestione della vita universitaria (corsi, esami, sessioni di studio, Pomodoro)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (Provider + ChangeNotifier come da slide del corso)
  provider: ^6.1.2

  # Routing
  go_router: ^17.2.3

  # Persistenza locale (sqflite + path)
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Preferenze utente (tema, nome)
  shared_preferences: ^2.2.3

  # Notifiche locali (Pomodoro)
  flutter_local_notifications: ^21.0.0

  # Aprire URL esterni (materiali corso)
  url_launcher: ^6.3.0

  # Calendario mensile
  table_calendar: ^3.1.2

  # Grafici (anello completamento / dashboard)
  fl_chart: ^1.2.0

  # Formattazione date/numeri in italiano
  intl: ^0.20.2

  # Uuid per id
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "app_icon.png"
